x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build: ./gateway
    container_name: optagent-gateway
    ports:
      - "82:80"
    depends_on:
      - frontend
      - backend
      - admin-frontend
      - admin-backend
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build: ./frontend
    container_name: optagent-frontend
    restart: unless-stopped
    logging: *default-logging

  admin-frontend:
    build: ./admin-frontend
    container_name: optagent-admin-frontend
    restart: unless-stopped
    logging: *default-logging

  ocr:
    build: ./ocr-service
    container_name: optagent-ocr
    ports:
      - "8100:8000"
    env_file:
      - path: ./ocr-service/.env
        required: false
    restart: unless-stopped
    logging: *default-logging

  jev:
    build: ./jev-service
    container_name: optagent-jev
    ports:
      - "8101:8000"
    env_file:
      - path: ./jev-service/.env
        required: false
    restart: unless-stopped
    logging: *default-logging

  bom:
    build: ./bom-service
    container_name: optagent-bom
    ports:
      - "8102:8000"
    env_file:
      - path: ./bom-service/.env
        required: false
    restart: unless-stopped
    logging: *default-logging

  fresh:
    build: ./fresh-service-v4
    container_name: optagent-fresh
    ports:
      - "8104:8000"
    env_file:
      # 2026-11-26: single container-form env file, same rule as agent-backend
      - path: ./fresh-service-v4/.env
        required: false
    restart: unless-stopped
    logging: *default-logging

  # 可选推理服务：不加入 backend 的 depends_on，缺失时后端按未配置降级
  laya:
    build:
      context: ./laya-service
      dockerfile: Dockerfile
    image: laya-service
    container_name: optagent-laya
    ports:
      - "8103:8000"
    env_file:
      - path: ./laya-service/.env
        required: false
    environment:
      - DECIS_SHUTDOWN_GRACE_MS=25000
    mem_limit: 6g
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./agent-backend
    container_name: optagent-backend
    hostname: optagent-backend
    # 应用内 15s 优雅关闭，Docker 默认 10s 会提前 SIGKILL
    stop_grace_period: 25s
    # 2026-11-26: single source -- container-form values (incl. PUBLIC_BASE_URL,
    # ADMIN_BACKEND_URL, INTENT_FOCUS_BASE_URL) all live in agent-backend/.env.
    # No `environment:` overrides any more: one parameter, one owner.
    env_file:
      - ./agent-backend/.env
    volumes:
      - ./agent-backend/config.yaml:/app/config.yaml:ro
      - ./agent-backend/.opt-agent:/app/.opt-agent
    restart: unless-stopped
    logging: *default-logging

  # 账号域数据库（028/029）。仅 compose 内网可达：不发布端口，宿主机连不上（有意为之）。
  # 参数只在一个地方：./admin-backend/.env 的 MYSQL_DATABASE / MYSQL_USER /
  # MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD（该文件同时注入 admin-backend，避免两处抄同一口令）。
  # 首次启动（数据卷为空）自动执行 schema.sql 建表与种子；之后的 DDL 变更按该文件头部的
  # 升级说明手工应用。备份走 mysqldump（见 specs/029-account-mysql-alignment/quickstart.md §7）。
  mysql:
    image: mysql:8.0
    container_name: optagent-mysql
    hostname: optagent-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # DATETIME 无时区：与账号域"本地时间字符串"口径一致
      - --default-time-zone=+08:00
    # 仅回环可连：宿主机上的 npm run dev / db:* 脚本要连 3306，
    # 但不能暴露到局域网（服务器部署时保持同一写法即可）。
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - ./admin-backend/.env
    volumes:
      - optagent_mysql_data:/var/lib/mysql
      - ./specs/028-account-mysql-binding/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      # 首次启动要跑 initdb（临时实例不监听 TCP），给足时间
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging

  admin-backend:
    build: ./admin-backend
    container_name: optagent-admin-backend
    hostname: optagent-admin-backend
    env_file:
      - ./admin-backend/.env
    volumes:
      - ./admin-backend/.platform-data:/app/.platform-data
      - ./agent-backend/.opt-agent:/app/.opt-agent
      # 本体市场（只读）
      - ../optonto/.data/onto_market:/opt/onto_market:ro
    depends_on:
      backend:
        condition: service_started
      # STORAGE_DRIVER=mysql 时启动期要连接成功，否则拒绝启动
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  # 显式命名：备份/迁移时认这个名字，且不随项目目录名变化（不写 name 会变成 <项目名>_optagent_mysql_data）
  optagent_mysql_data:
    name: optagent_mysql_data
