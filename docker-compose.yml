# 全部服务的容器日志轮转（任务 2026-09-15）：
# json-file 驱动的轮转按**大小**而非按天（Docker 限制）——10MB × 3 个文件，
# 滚动覆盖最旧的；管理界面读取时另有 tail 上限（≤500 行），两层都有界。
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 统一入口网关：所有外部流量经此分发，新增平台只改 gateway/nginx.conf
  gateway:
    build: ./gateway
    container_name: optagent-gateway
    ports:
      # 宿主机对外端口固定 82（2026-09-23：取消根 .env 插值——编排层不再有可变项，
      # 端口调整直接改本文件。原 GATEWAY_HOST_PORT 的实际取值与默认值等价，无迁移成本）
      - "82:80"
    depends_on:
      - frontend
      - backend
      - admin-frontend
      - admin-backend
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build: ./frontend
    container_name: optagent-frontend
    restart: unless-stopped
    logging: *default-logging

  # ---- 数字人管理平台：管理界面（Vue 3 静态资源 + SPA 回退）----
  admin-frontend:
    build: ./admin-frontend
    container_name: optagent-admin-frontend
    restart: unless-stopped
    logging: *default-logging

  # OCR MCP 服务：RapidOCR，streamable-http，仅内网（backend 经 MCP 调用）
  # 无共享存储：经签名直链回源 backend 下载图片（远程部署形态预演）
  ocr:
    build: ./ocr-service
    container_name: optagent-ocr
    # 向宿主机发布 8000：本地直跑（非 Docker）的 backend 经 LAN IP 访问 OCR
    ports:
      - "8000:8000"
    # 可调项（下载上限、超时）都有代码缺省值；本机私产放 .env.local（gitignore，缺失不报错）。
    # 2026-09-28：回源 host 白名单（OCR_URL_ALLOW_HOSTS）已移除——回源地址由运行环境按
    # PUBLIC_BASE_URL **单点铸造**后注入，服务侧不再各自验一遍主机名（也无需三处配置对齐）。
    env_file:
      - path: ./ocr-service/.env.local
        required: false
    restart: unless-stopped
    logging: *default-logging

  # Jev 决策 MCP 服务：TypeSafe System One（state + 类型化问题 → 结构化决策），仅内网
  # 无共享存储：引用文件时经签名直链回源 backend 下载（与 OCR 同一套机制）
  jev:
    build: ./jev-service
    container_name: optagent-jev
    # 向宿主机发布 8101：本地直跑（非 Docker）的 backend 经 LAN IP 访问 Jev
    # 端口固定 8101（2026-09-23：取消根 .env 插值，编排层不再有可变项）
    # 2026-10-04：8001 → 8101。原因：同机 optonto 编排的 core-backend 占用了宿主 8001
    # （其 compose 声明 "8001:8001"），两边抢同一端口——症状是 jev 起来后宿主端口拿不到、
    # 8001 实际应答的是 optonto core-backend。平台侧 jev 服务的 url 一并改用 8101。
    ports:
      - "8101:8000"
    # 本机私产放 .env.local（gitignore）：TYPESAFE_API_KEY、上游端点与超时等；
    # 缺失不报错（Key 缺省时服务照常启动，三个工具返回可读错误）。
    # 首次：cp jev-service/.env.example jev-service/.env.local 并填入 Key。
    # 2026-09-28：回源 host 白名单（JEV_URL_ALLOW_HOSTS）已移除——回源地址由运行环境按
    # PUBLIC_BASE_URL **单点铸造**后注入，服务侧不再各自验一遍主机名。
    env_file:
      - path: ./jev-service/.env.local
        required: false
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./agent-backend
    container_name: optagent-backend
    # 固定 hostname：容器默认 hostname 是容器 ID（每次重建都变，日志里读不出是谁）。
    # 日志的实例区分交给每行的 instance_id（hostname-pid-启动时刻），这里只求可读。
    hostname: optagent-backend
    # 优雅关闭宽限：应用内是 15s（等"进行中的回答"写完收尾），Docker 默认只等 10s
    # → 应用还没来得及记 shutdown.closed 就被 SIGKILL，在途回答也被硬杀。
    stop_grace_period: 25s
    env_file:
      # .env（入库）= Docker 形态配置；.env.local（本机私产，gitignore）= 本地形态 + 密钥
      # ——容器运行也需要密钥，故两个都注入（compose 多 env_file，后者补充/覆盖前者）
      - ./agent-backend/.env
      - ./agent-backend/.env.local
    environment:
      # 签名直链对外基址：MCP 服务（同网络）经此回源下载文件。
      # env_file 之后的显式覆盖，保证容器内一定是服务名口径（本机 LAN IP 只留在 .env.local）
      - PUBLIC_BASE_URL=http://backend:3000
    volumes:
      # 模型配置（必需，缺省启动失败）
      - ./agent-backend/config.yaml:/app/config.yaml:ro
      # 运行期数据（用户数据、日志、usage.db）bind mount：本地 agent-backend/.opt-agent 实时双向同步
      - ./agent-backend/.opt-agent:/app/.opt-agent
    restart: unless-stopped
    logging: *default-logging

  # ---- 数字人管理平台：管理服务 ----
  # 2026-09-27：MCP 服务改为**平台内全人工配置**，平台不再读容器编排声明、
  # 也不再读 Docker 容器状态，故本服务**不再挂载 docker.sock，也不再挂载
  # docker-compose.yml**（原有的容器状态/日志/启停能力已整体下架）。
  admin-backend:
    build: ./admin-backend
    container_name: optagent-admin-backend
    # 同 backend：让日志里的 hostname 可读（实例区分靠 instance_id）
    hostname: optagent-admin-backend
    # 容器形态运行配置 = 入库的 .env（2026-09-20 起与 backend 段同模式）：
    # compose 启动时注入容器，compose 文件本身不再逐行配置。
    # 注意：变量插值（${VAR}）用的是**仓库根** .env，与 env_file 注入是两条独立通道。
    env_file:
      - ./admin-backend/.env
    volumes:
      # 平台设计态（读写；不进镜像；随 admin-backend 源码目录走，与 .opt-agent 布局对称）
      - ./admin-backend/.platform-data:/app/.platform-data
      # 物化目标：与运行环境共享同一份用户数据目录（FR-001）
      - ./agent-backend/.opt-agent:/app/.opt-agent
      # 本体市场（只读，2026-10-02；2026-10-03 起两个功能区共用同一挂载点）：
      #   - SKILL 管理：从 `{场景}/{本体}/skills/{技能}` 导入技能
      #   - 本体管理：从 `{场景}/{本体}/ontology.yaml` 导入本体
      - ../optonto/.data/onto_market:/opt/onto_market:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  # ---- 容器内测试已移除（宪章 2.0.0）----
  # 宪章原则三：测试环境＝仅本地（宿主机）；容器 MUST NOT 承担任何测试职责。
  # 故原 `backend-test` / `ocr-test` 两个 test profile 及其 `Dockerfile.test` 已删除。
  # 等价命令（MUST 在宿主机本地执行）：
  #   agent-backend : cd agent-backend && npm run test:all && npm run test:coverage
  #   admin-backend : cd admin-backend && npm run test && npm run test:coverage
  #   ocr-service   : cd ocr-service && pip install -r requirements-test.txt && python -m pytest -q tests
  # MUST NOT 重新引入容器测试 profile（见宪章「治理 § 修订程序」）。
