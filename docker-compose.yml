x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build: ./gateway
    container_name: optagent-gateway
    ports:
      - "82:80"
    depends_on:
      - frontend
      - backend
      - admin-frontend
      - admin-backend
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build: ./frontend
    container_name: optagent-frontend
    restart: unless-stopped
    logging: *default-logging

  admin-frontend:
    build: ./admin-frontend
    container_name: optagent-admin-frontend
    restart: unless-stopped
    logging: *default-logging

  ocr:
    build: ./ocr-service
    container_name: optagent-ocr
    ports:
      - "8100:8000"
    env_file:
      - path: ./ocr-service/.env
        required: false
    restart: unless-stopped
    logging: *default-logging

  jev:
    build: ./jev-service
    container_name: optagent-jev
    ports:
      - "8101:8000"
    env_file:
      - path: ./jev-service/.env
        required: false
    restart: unless-stopped
    logging: *default-logging

  bom:
    build: ./bom-service
    container_name: optagent-bom
    ports:
      - "8102:8000"
    env_file:
      - path: ./bom-service/.env
        required: false
    restart: unless-stopped
    logging: *default-logging

  fresh:
    build: ./fresh-service-v4
    container_name: optagent-fresh
    ports:
      - "8104:8000"
    env_file:
      # 2026-11-26: single container-form env file, same rule as agent-backend
      - path: ./fresh-service-v4/.env
        required: false
    restart: unless-stopped
    logging: *default-logging

  # 可选推理服务：不加入 backend 的 depends_on，缺失时后端按未配置降级
  laya:
    build:
      context: ./laya-service
      dockerfile: Dockerfile
    image: laya-service
    container_name: optagent-laya
    ports:
      - "8103:8000"
    env_file:
      - path: ./laya-service/.env
        required: false
    environment:
      - DECIS_SHUTDOWN_GRACE_MS=25000
    mem_limit: 6g
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./agent-backend
    container_name: optagent-backend
    hostname: optagent-backend
    # 应用内 15s 优雅关闭，Docker 默认 10s 会提前 SIGKILL
    stop_grace_period: 25s
    # 2026-11-26: single source -- container-form values (incl. PUBLIC_BASE_URL,
    # ADMIN_BACKEND_URL, INTENT_FOCUS_BASE_URL) all live in agent-backend/.env.
    # No `environment:` overrides any more: one parameter, one owner.
    env_file:
      - ./agent-backend/.env
    volumes:
      - ./agent-backend/config.yaml:/app/config.yaml:ro
      - ./agent-backend/.opt-agent:/app/.opt-agent
    restart: unless-stopped
    logging: *default-logging

  admin-backend:
    build: ./admin-backend
    container_name: optagent-admin-backend
    hostname: optagent-admin-backend
    env_file:
      - ./admin-backend/.env
    volumes:
      - ./admin-backend/.platform-data:/app/.platform-data
      - ./agent-backend/.opt-agent:/app/.opt-agent
      # 本体市场（只读）
      - ../optonto/.data/onto_market:/opt/onto_market:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
