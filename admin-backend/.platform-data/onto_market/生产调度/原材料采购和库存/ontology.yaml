metadata:
  source_file: 原材料采购需求分析.md
  source_thread: 原材料采购与库存管理
  created_at: '2026-07-15 16:05:02'
  deployed_version: v1.0
  shard_hash: d8d9a8bb2ad1b019
  scenario_name: 生产调度
  scenario_id: 1
  ontology_name: 原材料采购和库存
  ontology_id: 1
concepts:
- name: RawMaterial
  description: 生产过程中消耗的外部输入物料，是采购和库存管理的核心对象。
  attributes:
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    description: ''
    example: RM-001
    constraint:
      unique: true
      required: true
      enum: []
      pattern: ''
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    description: ''
    example: 高强度钢板
    constraint:
      unique: false
      required: true
      enum: []
      pattern: ''
  - name: unit
    type: string
    display_name: 单位
    description: ''
    example: 吨
    constraint:
      unique: false
      required: true
      enum: []
      pattern: ''
  - name: safetyStock
    type: number
    display_name: 安全库存
    description: ''
    example: '100'
  - name: status
    type: string
    display_name: 状态
    description: ''
    example: ''
    constraint:
      unique: false
      required: true
      enum:
      - 有效
      - 无效
      pattern: ''
  display_name: 原材料
  instance_label: rawMaterialName
  terms: []
- name: Supplier
  description: 原材料的供应方，可以供应一种或多种原材料。
  attributes:
  - name: supplierId
    type: string
    display_name: 供应商编号
    description: ''
    example: SUP-001
    constraint:
      unique: true
      required: true
      enum: []
      pattern: ''
  - name: supplierName
    type: string
    display_name: 供应商名称
    description: ''
    example: XX钢铁集团
    constraint:
      unique: true
      required: true
      enum: []
      pattern: ''
  - name: address
    type: string
    display_name: 地址
    description: ''
    example: XX省XX市XX路XX号
  - name: contactPerson
    type: string
    display_name: 联系人
    description: ''
    example: 张三
  - name: contactPhone
    type: string
    display_name: 联系电话
    description: ''
    example: '13800138000'
  display_name: 供应商
  instance_label: supplierName
  terms: []
- name: PurchaseRecord
  description: 一次具体的原材料采购行为，关联了采购的原材料、供应商以及驱动采购的客户订单。
  attributes:
  - name: purchaseRecordId
    type: string
    display_name: 采购单号
    description: ''
    example: PO-20231027-001
    constraint:
      unique: true
      required: true
      enum: []
      pattern: ''
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    description: ''
    example: RM-001
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    description: ''
    example: 高强度钢板
  - name: purchaseTime
    type: string
    display_name: 采购时间
    description: ''
    example: '2023-10-27'
  - name: arrivalTime
    type: string
    display_name: 到位时间
    description: ''
    example: '2023-11-10'
  - name: arrivalQuantity
    type: number
    display_name: 到位数量
    description: ''
    example: '50'
  - name: unit
    type: string
    display_name: 单位
    description: ''
    example: 吨
  - name: leadTime
    type: number
    display_name: 等待周期
    description: ''
    example: '14'
  - name: supplierName
    type: string
    display_name: 供应商名称
    description: ''
    example: XX钢铁集团
  - name: relatedOrderId
    type: string
    display_name: 关联订单编号
    description: ''
    example: SO-20231025-001
  - name: relatedOrderName
    type: string
    display_name: 关联订单名称
    description: ''
    example: 客户A-项目X订单
  display_name: 原材料采购记录
  instance_label: purchaseRecordId
  terms: []
- name: RawMaterialInventory
  description: 特定原材料在当前时刻的库存状态快照，包括待入库、可用和累计库存量。
  attributes:
  - name: inventoryId
    type: string
    display_name: 库存编号
    description: ''
    example: INV-RM-001
    constraint:
      unique: true
      required: true
      enum: []
      pattern: ''
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    description: ''
    example: RM-001
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    description: ''
    example: 高强度钢板
  - name: materialType
    type: string
    display_name: 材料类型
    description: ''
    example: 原材料
  - name: pendingReceiptQuantity
    type: number
    display_name: 待入库量
    description: ''
    example: '50'
  - name: cumulativeStockQuantity
    type: number
    display_name: 累计库存量
    description: ''
    example: '200'
  - name: availableStock
    type: number
    display_name: 可用库存
    description: ''
    example: '150'
  - name: unit
    type: string
    display_name: 单位
    description: ''
    example: 吨
  display_name: 原材料库存
  instance_label: availableStock
  terms: []
- name: CustomerOrder
  description: 客户下达的销售订单或询单，是驱动原材料采购的源头需求。
  attributes:
  - name: customerOrderId
    type: string
    display_name: 订单编号
    description: ''
    example: SO-20231025-001
    constraint:
      unique: true
      required: true
      enum: []
      pattern: ''
  - name: customerOrderName
    type: string
    display_name: 订单名称
    description: ''
    example: 客户A-项目X订单
  - name: batchNumber
    type: string
    display_name: 订单批次号
    description: ''
    example: BATCH-001
  - name: bufferPeriod
    type: number
    display_name: 订单缓冲周期
    description: ''
    example: '7'
  - name: orderType
    type: enum
    display_name: 订单类型
    description: ''
    example: 销售
  - name: status
    type: enum
    display_name: 订单状态
    description: ''
    example: 有效
  display_name: 客户订单
  instance_label: customerOrderName
  terms: []
- name: DeliveryCapability
  description: 供应商的交货能力，包括交货周期、最低交货数量等
  attributes:
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    description: ''
    example: ''
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    description: ''
    example: ''
  - name: supplierName
    type: string
    display_name: 供应商名称
    description: ''
    example: ''
  - name: supplierId
    type: string
    display_name: 供应商编号
    description: ''
    example: ''
  - name: leadTime
    type: number
    display_name: 交货周期
    description: ''
    example: ''
  - name: minCount
    type: number
    display_name: 最小交货数
    description: ''
    example: ''
  display_name: 交货能力
  instance_label: leadTime
  terms: []
relations:
- name: hasRawInventory
  source: RawMaterial
  target: RawMaterialInventory
  cardinality: '1:1'
  source_attr: rawMaterialId
  target_attr: rawMaterialId
  description: 每个原材料有且仅有一条对应的最新库存快照。
  display_name: 拥有库存
  relation_type:
  - functional
  - inverse_functional
- name: recordsRawMaterial
  source: PurchaseRecord
  target: RawMaterial
  cardinality: N:1
  source_attr: rawMaterialId
  target_attr: rawMaterialId
  description: 多个采购记录可以指向同一种原材料，但一个采购记录只采购一种原材料。
  display_name: 记录原材料
  relation_type:
  - functional
- name: orderedFromSupplier
  source: PurchaseRecord
  target: Supplier
  cardinality: N:1
  source_attr: supplierName
  target_attr: supplierName
  description: 多个采购记录可以从同一个供应商采购，但一个采购记录只对应一个供应商。
  display_name: 从...采购
  relation_type:
  - functional
- name: containsPurchaseRecord
  source: CustomerOrder
  target: PurchaseRecord
  cardinality: 1:N
  source_attr: customerOrderId
  target_attr: relatedOrderId
  description: 一个客户订单可以包含多个采购记录，但一个采购记录最多只能关联一个客户订单。
  display_name: 包含采购记录
  relation_type:
  - inverse_functional
- name: hasCapability
  source: Supplier
  target: DeliveryCapability
  cardinality: 1:N
  source_attr: supplierId
  target_attr: supplierId
  description: 一个供应商可以包含多个原材料的供应能力，但一个交货能力只对应一个供应商
  display_name: 拥有供应能力
  relation_type:
  - inverse_functional
functions:
- name: sumRawNotArrivalQty
  display_name: 原材料未到位数
  description: 根据传入的数据包指定的原材料，过滤掉到位时间小于当前时间的部分，对剩余部分的到位数arrivalQuantity求和。
  related_concepts:
  - PurchaseRecord
  params:
    filterRawMaterialName:
      type: string
      display_name: 原材料名称
      example: 高强度钢板
      required: true
    currentDate:
      type: string
      display_name: 日期
      example: '2026-01-01'
      required: true
    purchaseRecordSet:
      type: array
      display_name: 采购记录集
      items:
        type: object
        properties:
          arrivalTime:
            type: string
            display_name: 到位时间
            example: '2026-09-01'
            required: true
          rawMaterialName:
            type: string
            display_name: 原材料名称
            example: 高强度钢板
            required: true
          arrivalQuantity:
            type: number
            display_name: 计划的到位数量
            example: 100
            required: true
      required: true
  response:
    rawMaterialName:
      type: string
      display_name: 原材料名称
      example: 高强度钢板
    sumNotArrivalQty:
      type: number
      display_name: 未到位总量
      example: 100
  code_file: functions/sumRawNotArrivalQty.py
  type: CALCULATION
- name: checkRawMaterialUnit
  display_name: 校验采购原材料单位一致性
  description: 校验采购单的 rawMaterialId 存在于原材料主数据，且 unit 与原材料定义单位一致。服务于前置规则 V01。
  related_concepts:
  - PurchaseRecord
  - RawMaterial
  params:
    rawMaterialId:
      type: string
      display_name: 原材料ID
      example: RM-001
      required: true
    unit:
      type: string
      display_name: 计量单位
      example: 吨
      required: true
    rawMaterialSet:
      type: array
      display_name: 原材料主数据集
      required: true
      items:
        type: object
        properties:
          rawMaterialId:
            type: string
            display_name: 原材料ID
            required: true
          unit:
            type: string
            display_name: 单位
            required: true
  response:
    pass:
      type: boolean
      display_name: 裁决是否通过
      description: 规则裁决结论；false 时系统拒绝主行为
    reason:
      type: string
      display_name: 裁决说明
  code_file: functions/checkRawMaterialUnit.py
  type: VALIDATION
- name: checkArrivalTimeValidity
  display_name: 校验采购到位时间合理性
  description: 校验采购单的到位时间（arrivalTime）晚于采购发生日（当前日期）。服务于前置规则 V03。
  related_concepts:
  - PurchaseRecord
  params:
    arrivalTime:
      type: string
      display_name: 到位时间
      example: '2023-11-10'
      required: true
    currentDate:
      type: string
      display_name: 采购发生日（当前日期）
      example: '2023-10-27'
      required: true
  response:
    pass:
      type: boolean
      display_name: 判断是否通过
      description: 判断结论；false 时系统拒绝主行为
    reason:
      type: string
      display_name: 判断说明
  code_file: functions/checkArrivalTimeValidity.py
  type: VALIDATION
- name: checkSupplierExistence
  display_name: 校验采购供应商存在性
  description: 校验采购单的供应商名称存在于供应商主数据。服务于前置规则 V05。
  related_concepts:
  - PurchaseRecord
  - Supplier
  params:
    supplierName:
      type: string
      display_name: 供应商名称
      example: XX钢铁集团
      required: true
    supplierSet:
      type: array
      display_name: 供应商主数据集
      required: true
      items:
        type: object
        properties:
          supplierName:
            type: string
            display_name: 供应商名称
            required: true
  response:
    pass:
      type: boolean
      display_name: 判断是否通过
      description: 判断结论；false 时系统拒绝主行为
    reason:
      type: string
      display_name: 判断说明
  code_file: functions/checkSupplierExistence.py
  type: VALIDATION
- name: checkRelatedOrderExistence
  display_name: 校验采购关联订单存在性
  description: 校验采购单的关联客户订单：未填写通过，填写时必须存在于客户订单集合（客户订单数据需跨本体提供）。服务于前置规则 I04。
  related_concepts:
  - PurchaseRecord
  params:
    relatedOrderId:
      type: string
      display_name: 关联客户订单编号
      example: SO-20231025-001
      required: false
    customerOrderSet:
      type: array
      display_name: 客户订单集
      required: false
      items:
        type: object
        properties:
          customerOrderId:
            type: string
            display_name: 客户订单编号
            required: true
  response:
    pass:
      type: boolean
      display_name: 判断是否通过
      description: 判断结论；false 时系统拒绝主行为
    reason:
      type: string
      display_name: 判断说明
  code_file: functions/checkRelatedOrderExistence.py
  type: VALIDATION
- name: inferPurchasePurpose
  display_name: 推导采购目的
  description: 根据关联客户订单推导采购目的（未关联→补充库存；否则→生产订单备料）。服务于后置规则 I03（推导型，不阻断）。
  related_concepts:
  - PurchaseRecord
  params:
    relatedOrderId:
      type: string
      display_name: 关联客户订单编号
      example: SO-20231025-001
      required: false
  response:
    purchasePurpose:
      type: string
      display_name: 采购目的
      example: 补充库存
    reason:
      type: string
      display_name: 推导说明
  code_file: functions/inferPurchasePurpose.py
  type: CALCULATION
