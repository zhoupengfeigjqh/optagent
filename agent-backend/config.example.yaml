# 模型列表：默认取第一项，models 缺失或为空时服务拒绝启动
models:
  - model: deepseek-v4-flash-vision-exp
    api_key: $DEEPSEEK_API_KEY # 支持 $ENV_VAR 引用，也可直接填明文
    base_url: https://api.deepseek.com
  # - model: deepseek-chat
  #   api_key: sk-xxxx
  #   base_url: https://api.deepseek.com

# 意图聚焦（可选块）：整块缺失 = 功能不可用且不影响启动；字段不全或越界 = 启动失败
# 十个字段之外的键一律拒绝启动
# intent_focus:
#   base_url: $INTENT_FOCUS_BASE_URL  # 必填；只到主机端口，不带路径；用 $VAR 引用以便两形态共用
#                                     #   本地 127.0.0.1:8103 / 容器 laya:8000
#   model: laya-multilingual
#   api_key: $DECIS_API_KEY           # 必填；不回落 DEEPSEEK_API_KEY
#   timeout_ms: 30000                 # 300~30000 毫秒；整轮预算，超时降级不重试
#   skill_threshold: 0.8              # 0~1；可被 INTENT_FOCUS_SKILL_THRESHOLD 覆盖
#   ontology_behavior_threshold: 0.8  # 0~1；可被 INTENT_FOCUS_ONTOLOGY_BEHAVIOR_THRESHOLD 覆盖
#   ontology_function_threshold: 0.8  # 0~1；可被 INTENT_FOCUS_ONTOLOGY_FUNCTION_THRESHOLD 覆盖
#   max_skills: 32                    # 1~256
#   max_capabilities: 96              # 1~96；行为与函数候选合计上限
#
# 输入改写：开关由管理台「意图聚焦 → 输入重写」决定，默认关闭
#   rewrite_threshold: 0.8            # 0~1；score 严格大于该值才改写
#   rewrite_timeout_ms: 5000          # 300~10000 毫秒；不得大于 timeout_ms
#
# 规划门禁（028，可选键）：数字人开启 task_planning 时，先用 laya 判"这轮是否涉及多个对象或多个任务"，
# 分数 >= plan_threshold 才发起规划调用；不配置 plan_threshold = 门禁关闭（开规划即走规划）。
# 判定失败/超时一律 fail-open（仍走规划），不会因为判定服务抖动而降级掉规划能力。
#   plan_threshold: 0.4               # 0~1；缺省缺键即关闭（只认本文件，不再有同名 env）
#   plan_timeout_ms: 5000             # 300~10000 毫秒；缺省 5000；不得大于 timeout_ms
#
# 运行期策略（可选块；缺省即下列值）：原 MCP_TIMEOUT_MS / LLM_* 环境变量已迁入此处
# runtime:
#   mcp_timeout_ms: 90000             # 单次 MCP 工具调用上限（1000~600000）
#   mcp_connect_timeout_ms: 10000     # 单服务建连上限（1000~60000），不得大于 mcp_timeout_ms
#   llm_max_retries: 2                # 主模型重试次数（0~5）
#   llm_retry_max_delay_ms: 15000     # 单次重试等待上限（0~60000；0 = 不设上限）
#
# 规划上限（可选块；缺省即下列值）：只开三个口子，其余 13 项规划常量是算法不变量
# plan:
#   timeout_ms: 20000                 # 单次规划调用上限（1000~600000 毫秒）
#   total_steps_max: 20               # 单轮总步数上限（1~100）
#   replan_max_per_run: 6             # 失败驱动重规划上限（0~50）
