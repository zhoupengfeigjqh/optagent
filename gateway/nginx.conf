# ===== 统一入口网关 =====
# 所有外部流量经此 nginx 分发到各后端服务。
# 新增平台时只需加 location 块并重启 gateway 容器。
#
# 路由一览（nginx 前缀匹配取**最长优先**，故 /api/admin/ 必然先于 /api/ 命中）：
#   /api/admin/ → admin-backend  数字人管理平台接口
#   /admin/     → admin-frontend 数字人管理平台界面
#   /api/       → backend        既有对话后端
#   /           → frontend       既有对话工作台

# SSE / 长连接通用代理参数（聊天流式接口必须关缓冲）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;

    # 上传文件大小上限与后端 UPLOAD_MAX_MB=50 对齐
    client_max_body_size 60m;

    # ---- 数字人管理平台：管理服务接口 ----
    # 契约基址为 /api/admin/*（contracts/admin-api.md §0.1），故**不**剥离前缀
    location /api/admin/ {
        proxy_pass http://admin-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        client_max_body_size 60m;   # 与 SKILL ZIP 上传上限对齐
    }

    # ---- 数字人管理平台：管理界面静态资源 ----
    # 尾部斜杠让 nginx 剥离 /admin 前缀：/admin/assets/x.js → /assets/x.js
    # （与 vite `base: '/admin/'` 配套）
    location /admin/ {
        proxy_pass http://admin-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- optagent 后端 API ----
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE：关闭缓冲，长连接
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- optagent 前端静态资源（默认兜底）----
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
