# ===== 统一入口网关 =====
# 所有外部流量经此 nginx 分发到各后端服务。
# 新增平台（MCP / skill / 数字人设计）时只需加 location 块并重启 gateway 容器。

# SSE / 长连接通用代理参数（聊天流式接口必须关缓冲）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;

    # 上传文件大小上限与后端 UPLOAD_MAX_MB=50 对齐
    client_max_body_size 60m;

    # ---- optagent 后端 API ----
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE：关闭缓冲，长连接
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- MCP 服务平台（待接入）----
    # location /mcp/ {
    #     proxy_pass http://mcp-platform:8000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_buffering off;   # MCP SSE/streamable-http 同样需要
    #     proxy_read_timeout 3600s;
    # }

    # ---- skill 服务平台（待接入）----
    # location /skill/ {
    #     proxy_pass http://skill-platform:8000/;
    # }

    # ---- 数字人设计平台（待接入）----
    # location /designer/ {
    #     proxy_pass http://designer-platform:8000/;
    # }

    # ---- optagent 前端静态资源（默认兜底）----
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
