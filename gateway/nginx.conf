# ===== 统一入口网关 =====
# 所有外部流量经此 nginx 分发到各后端服务。
# 新增平台时只需加 location 块并重启 gateway 容器。
#
# 路由一览（nginx 前缀匹配取**最长优先**，故 /api/admin/ 必然先于 /api/ 命中）：
#   /api/admin/ → admin-backend  数字人管理平台接口
#   /admin/     → admin-frontend 数字人管理平台界面
#   /api/       → backend        既有对话后端
#   /           → frontend       既有对话工作台

# SSE / 长连接通用代理参数（聊天流式接口必须关缓冲）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;

    # 请求体上限 = 文件上限(UPLOAD_MAX_MB=5MB) + 1MB multipart 余量
    # （取同值 5m 会让接近 5MB 的文件因 multipart 开销被网关 413 拒掉）
    client_max_body_size 16m;

    # ---- 数字人管理平台：管理服务接口 ----
    # 契约基址为 /api/admin/*（contracts/admin-api.md §0.1），故**不**剥离前缀
    location /api/admin/ {
        proxy_pass http://admin-backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        client_max_body_size 6m;   # 与 SKILL ZIP 上传上限（UPLOAD_MAX_MB=5）+ 1MB multipart 余量
    }

    # ---- 数字人管理平台：管理界面静态资源 ----
    # 尾部斜杠让 nginx 剥离 /admin 前缀：/admin/assets/x.js → /assets/x.js
    # （与 vite `base: '/admin/'` 配套）
    location /admin/ {
        proxy_pass http://admin-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- optagent 后端 API ----
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE：关闭缓冲，长连接
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 排产数据服务（2026-10-22：原 vite dev 期 `/dataApi` 代理迁到网关）----
    # 前端 `src/api/datapage.js` 的 `API_PREFIX = '/dataApi'`，排产页面的全部接口都打到这里。
    # vite 的 rewrite（`/dataApi` → `/api`）由 proxy_pass 的尾部路径完成：
    #   /dataApi/x  →  http://192.168.0.188:8080/api/x
    # **两边结尾的斜杠都是语义**：`location /dataApi/` 少斜杠匹配不到，
    # `proxy_pass .../api/` 少斜杠会拼成 `/api/dataApi/x`。
    location /dataApi/ {
        proxy_pass http://192.168.0.188:8080/api/;
        # 对应 vite 的 `changeOrigin: true`：Host 改成目标主机名，
        # 原样透传访问域名时，目标服务若有 Host 校验会直接 400/403
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 目标不可达时快速失败（默认 60s 会让页面长时间转圈）
        proxy_connect_timeout 5s;
        # 排产求解类接口较慢，给足读超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- optagent 前端静态资源（默认兜底）----
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
